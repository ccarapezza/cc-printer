# CC-Printer A1 - macros de Klipper
# Copia maestra en la PC: Marlin-2.1.2/raspberry/klipper/macros.cfg

[gcode_macro CANCEL_PRINT]
description: Cancela la impresion, apaga calentadores y aleja el pico de la pieza
rename_existing: BASE_CANCEL_PRINT
gcode:
  TURN_OFF_HEATERS
  M106 S0
  CLEAR_PAUSE
  SDCARD_RESET_FILE
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set z = [printer.toolhead.position.z + 10, printer.toolhead.axis_maximum.z]|min %}
    G90
    G1 Z{z} F600
    G1 X0 F3000
  {% endif %}
  M84
  BASE_CANCEL_PRINT

[gcode_macro PAUSE]
description: Pausa: retrae 2 mm, sube 10 mm y corre el pico a X0
rename_existing: BASE_PAUSE
gcode:
  SAVE_GCODE_STATE NAME=pausa
  BASE_PAUSE
  {% if printer.extruder.can_extrude %}
    M83
    G1 E-2 F1500
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set z = [printer.toolhead.position.z + 10, printer.toolhead.axis_maximum.z]|min %}
    G90
    G1 Z{z} F600
    G1 X0 F3000
  {% endif %}

[gcode_macro RESUME]
description: Reanuda: vuelve a la posicion guardada y recupera los 2 mm retraidos
rename_existing: BASE_RESUME
gcode:
  {% if printer.extruder.can_extrude %}
    M83
    G1 E2 F1500
  {% endif %}
  RESTORE_GCODE_STATE NAME=pausa MOVE=1 MOVE_SPEED=40
  BASE_RESUME

[gcode_macro M300]
description: Pitido como en Marlin (P = duracion en ms; S se ignora, el buzzer tiene un solo tono)
gcode:
  {% set ms = params.P|default(100)|int %}
  SET_PIN PIN=beeper VALUE=1
  G4 P{ms}
  SET_PIN PIN=beeper VALUE=0
