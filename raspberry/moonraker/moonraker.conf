# CC-Printer A1 - Moonraker
[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: ~/printer_data/comms/klippy.sock

[authorization]
# Sin login: la red de casa y nginx local (127.0.0.1: Moonraker exige que el proxy sea de confianza).
# OJO TUNEL: el bloque nginx del tunel de Cloudflare DEBE mandar X-Real-IP = CF-Connecting-IP
# (IP de internet, no confiable) y nunca 127.0.0.1; si no, internet entraria sin login.
trusted_clients:
    192.168.0.0/24
    127.0.0.1/32
cors_domains:
    *.local
    *.lan
force_logins: False
# Desde internet (tunel) solo se entra con usuario de Fluidd: 5 intentos fallidos bloquean esa IP.
max_login_attempts: 5

[octoprint_compat]

[history]

[file_manager]
enable_object_processing: True

[update_manager]
refresh_interval: 168
enable_auto_refresh: True

[update_manager fluidd]
type: web
channel: stable
repo: fluidd-core/fluidd
path: ~/fluidd

# stream_url/snapshot_url los genera ~/cc-cam/rotar_link_camara.sh (ruta secreta para ver la camara desde afuera)
[webcam camara]
location: printer
service: mjpegstreamer-adaptive
target_fps: 15
stream_url: /cam-SECRETO/stream.mjpg
snapshot_url: /cam-SECRETO/snapshot.jpg
