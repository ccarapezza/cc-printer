# IP real de quien entra por el tunel de Cloudflare (cabecera CF-Connecting-IP, la pone Cloudflare).
# Si falta o dice ser una IP privada/local, se usa 203.0.113.254 (IP de documentacion, no confiable)
# para que Moonraker NUNCA trate al tunel como red de casa.
map $http_cf_connecting_ip $cc_tunnel_client_ip {
    ""                                                                203.0.113.254;
    "~^(127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.)" 203.0.113.254;
    "~*^(::1$|f[cd]|fe80)"                                            203.0.113.254;
    default                                                           $http_cf_connecting_ip;
}
