# Comun a la entrada LAN (:80) y a la del tunel (127.0.0.1:8081). Cada server define $cc_client_ip.
gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 4;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
root /home/chori/fluidd;
index index.html;
client_max_body_size 0;
proxy_request_buffering off;

location / { try_files $uri $uri/ /index.html; }
location = /index.html { add_header Cache-Control "no-store, no-cache, must-revalidate"; }

location /websocket {
    proxy_pass http://apiserver/websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $cc_client_ip;          # Moonraker decide "confiable" por esta IP
    proxy_set_header X-Forwarded-For $cc_client_ip;
    proxy_read_timeout 86400;
}
location ~ ^/(printer|api|access|machine|server)/ {
    proxy_pass http://apiserver$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $cc_client_ip;
    proxy_set_header X-Forwarded-For $cc_client_ip;
    proxy_set_header X-Scheme $scheme;
}
